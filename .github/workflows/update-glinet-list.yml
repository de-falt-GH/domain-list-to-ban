name: Update GL.iNet VPN list

on:
  schedule:
    # Every 6 hours; GitHub cron uses UTC.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Merge upstream domain and IPv4 lists
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = 'https://raw.githubusercontent.com/itdoginfo/allow-domains/main/'
          sources = {
              'Russia/inside-raw.lst': 100,
              'Services/telegram.lst': 5,
              'Subnets/IPv4/telegram.lst': 5,
          }

          merged = set()
          for source, minimum in sources.items():
              req = Request(base + source, headers={'User-Agent': 'glinet-list-merger/1.0'})
              with urlopen(req, timeout=40) as response:
                  data = response.read().decode('utf-8-sig')
              if '<html' in data[:1000].lower():
                  raise RuntimeError(f'Unexpected HTML response from {source}')
              entries = {
                  line.strip() for line in data.splitlines()
                  if line.strip() and not line.lstrip().startswith('#')
              }
              if len(entries) < minimum:
                  raise RuntimeError(f'{source}: only {len(entries)} entries, expected >= {minimum}')
              print(f'{source}: {len(entries)} entries')
              merged.update(entries)

          output = Path('glinet-merged.lst')
          output.write_text('\n'.join(sorted(merged, key=lambda s: (s.lower(), s))) + '\n', encoding='utf-8')
          print(f'{output}: {len(merged)} unique entries')
          PY

      - name: Commit updated list if changed
        shell: bash
        run: |
          git add glinet-merged.lst
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update merged GL.iNet VPN list'
          git push
